name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint with ruff
        # Whole repo, not just src/ and tests/. app/ and scripts/ were unlinted,
        # which is how an import-sort error sat in app/scorecard.py unnoticed.
        run: ruff check .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # pytest only — everything the app itself imports must come from
          # requirements.txt, so CI fails if a runtime dep goes undeclared.
          pip install pytest
      - name: Run tests
        run: pytest tests/ -v
